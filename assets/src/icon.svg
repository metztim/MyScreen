<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MyScreen app icon. Rendered to assets/icon.png with: rsvg-convert -w 1024 -h 1024 assets/src/icon.svg -o assets/icon.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45CBF8"/>
      <stop offset="0.55" stop-color="#14AAE2"/>
      <stop offset="1" stop-color="#0876BD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F3FB"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324A"/>
      <stop offset="1" stop-color="#0B1C2C"/>
    </linearGradient>
    <radialGradient id="rec" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FF6A63"/>
      <stop offset="1" stop-color="#E8212D"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <clipPath id="face"><circle cx="672" cy="652" r="116"/></clipPath>
  </defs>

  <!-- body -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.500" y="101.500" width="821" height="821" rx="184.500" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- the screen -->
  <g filter="url(#soft)">
    <rect x="212" y="282" width="552" height="372" rx="56" fill="url(#screen)"/>
  </g>
  <!-- record dot with its ring -->
  <circle cx="430" cy="468" r="92" fill="#E8212D" fill-opacity="0.14"/>
  <circle cx="430" cy="468" r="60" fill="url(#rec)"/>

  <!-- the camera bubble, overlapping the screen's corner -->
  <g filter="url(#soft)">
    <circle cx="672" cy="652" r="138" fill="#FFFFFF"/>
  </g>
  <circle cx="672" cy="652" r="116" fill="url(#cam)"/>
  <g clip-path="url(#face)" fill="#FFFFFF" fill-opacity="0.92">
    <circle cx="672" cy="622" r="44"/>
    <path d="M574 790 C574 716 620 684 672 684 C724 684 770 716 770 790 Z"/>
  </g>
</svg>
